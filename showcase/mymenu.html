<!doctype html>
<html lang="zh-CN">
  <head>
    <script>
      // Prevent theme flash
      (function(){
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历工作台 · 功能演示 - 靠枕</title>
    <meta name="description" content="在线简历编辑器：模块化编辑与拖拽排序、草稿自动保存、AI 解析导入 docx/PDF、版本回滚与一键导出 Word/PDF。功能演示页。" />
  </head>
  <body>
    <div id="root" data-slug="mymenu"></div>
    <script type="module" src="../src/showcase/main.tsx"></script>
  </body>
</html>
